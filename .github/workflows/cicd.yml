
name: CICD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build:
    name: Build and SonarQube
    needs: gitleaks
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=GC-Bank \
            -Dsonar.projectName=GC-Bank

      - name: Prepare Application JAR
        run: |
          mkdir -p app
          cp target/*.jar app/

      - name: Build Docker Image
        run: |
          docker build -t gc-bank:${GITHUB_SHA} .

      # NEW STEP: OPA Docker Security Validation
      - name: OPA Docker Policy Validation
        run: |
          echo "Checking OPA installation..."
          opa version

          echo "Inspecting Docker image..."
          docker image inspect gc-bank:${GITHUB_SHA} \
            --format '{{json .Config}}' > docker-config.json

          echo "Preparing OPA input..."
          jq --arg tag "${GITHUB_SHA}" \
            '{
              exposed_ports: (.ExposedPorts // {}),
              cmd: (.Cmd // []),
              tag: $tag
            }' docker-config.json > opa-input.json

          echo "Evaluating Docker security policy..."

          result=$(opa eval \
            --data opa/docker_policy.rego \
            --input opa-input.json \
            --format raw \
            "data.docker.security.allow")

          if [ "$result" != "true" ]; then
            echo "OPA POLICY VALIDATION FAILED"
            opa eval \
              --data opa/docker_policy.rego \
              --input opa-input.json \
              --format pretty \
              "data.docker.security.deny"
            exit 1
          fi

          echo "OPA POLICY VALIDATION PASSED"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin \
              209115427888.dkr.ecr.us-east-1.amazonaws.com

      - name: Tag Docker Image
        run: |
          docker tag gc-bank:${GITHUB_SHA} \
            209115427888.dkr.ecr.us-east-1.amazonaws.com/gc-bank:${GITHUB_SHA}

      - name: Push Docker Image to ECR
        run: |
          docker push \
            209115427888.dkr.ecr.us-east-1.amazonaws.com/gc-bank:${GITHUB_SHA}

      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            gc-bank:${GITHUB_SHA}      
