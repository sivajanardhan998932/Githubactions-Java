
name: CICD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build:
    name: Build and SonarQube
    needs: gitleaks
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=GC-Bank \
            -Dsonar.projectName=GC-Bank

      - name: Prepare Application JAR
        run: |
          mkdir -p app
          cp target/*.jar app/

      - name: Build Docker Image
        run: |
          docker build -t gc-bank:${GITHUB_SHA} .

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin \
              209115427888.dkr.ecr.us-east-1.amazonaws.com

      - name: Tag Docker Image
        run: |
          docker tag gc-bank:${GITHUB_SHA} \
            209115427888.dkr.ecr.us-east-1.amazonaws.com/gc-bank:${GITHUB_SHA}

      - name: Push Docker Image to ECR
        run: |
          docker push \
            209115427888.dkr.ecr.us-east-1.amazonaws.com/gc-bank:${GITHUB_SHA}
